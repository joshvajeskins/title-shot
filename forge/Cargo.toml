[package]
name = "titleshot-forge"
version = "0.1.3"
edition = "2021"
description = "TITLE SHOT forge: OutLayer WASI-P2 app that compiles a sentence with NEAR AI Cloud and draws a VRF seed"
publish = false

[workspace]

[lib]
name = "titleshot_forge"
path = "src/lib.rs"

[[bin]]
name = "titleshot-forge"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
bout-sim = { path = "../crates/bout-sim" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-http-client = "0.2"
wasi = "0.13.3"
outlayer = "0.2.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
