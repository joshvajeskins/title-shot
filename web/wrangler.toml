# Cloudflare Pages project `title-shot` (preview URL only). Static site = dist/, API = functions/.
# Secrets are never in this file: `wrangler pages secret put <NAME> --project-name title-shot` (see scripts/cf-setup.sh),
# or web/.dev.vars for local `wrangler pages dev` (gitignored, written by scripts/gen-dev-vars.ts).
name = "title-shot"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "TS_KV"
# Local dev uses an on-disk simulation. scripts/cf-setup.sh replaces this id with the real namespace before the first deploy.
id = "e60c0da96bd64a4e93f53e554987c379"

[vars]
# Set after the contract is deployed (a blank value keeps the API in "not deployed" mode: preview and static routes still work).
CONTRACT_ID = ""
SPONSOR_ID = "play.titleshot.testnet"
VANCE_ID = "vance.titleshot.testnet"
RELAYER_ID = "relay.titleshot.testnet"
MPC_SIGNER = "v1.signer-prod.testnet"
NEAR_RPC_URLS = "https://near-testnet.drpc.org,https://test.rpc.fastnear.com,https://rpc.testnet.fastnear.com"
BASE_RPC_URLS = "https://sepolia.base.org,https://base-sepolia-rpc.publicnode.com"
NEARAI_MODEL = "z-ai/glm-5.3-flash"
# NEARAI_BUDGET_USD / NEARAI_PUBLIC_DAILY_USD / NEARAI_PUBLIC_TOTAL_USD are NOT set here: scripts/rotate-nearai-key.sh pushes
# them as Pages secrets with each key (a [vars] entry of the same name would clash). Unset = 2.5 / 0.05 / 0.25.
PURSE_WEI = "2000000000000000"
SEASON_SEC = "21600"
SPONSOR_FLOOR_NEAR = "0.8"
GUEST_DEPOSIT_NEAR = "0.3"
GUEST_GAS_NEAR = "0.1"
