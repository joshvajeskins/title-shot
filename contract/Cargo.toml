[package]
name = "titleshot"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
publish = false
license = "MIT"
description = "TITLE SHOT+ belt contract: attested AI fighter compile, in-contract best-of-3, NEP-171 belts, Chain Signatures purse"

# Standalone crate (no root workspace): contract/it and contract/mocks are their own workspaces.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", default-features = false, features = ["unstable"] }
bout-sim = { path = "../crates/bout-sim" }
# Not used directly: `raw_value` lets a view return pre-serialized JSON (json::Raw) verbatim; features unify with near-sdk's copy.
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
hex = "0.4"
near-sdk = { version = "=5.17.2", default-features = false, features = ["unstable", "unit-testing"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Off on purpose (-19 KB of panic paths): every money or time sum is bounded by an explicit check (MAX_TOLL, MAX_PURSE_WEI,
# duration and gas bounds) and native tests run with overflow checks on. See README "Departures".
overflow-checks = false
strip = true
