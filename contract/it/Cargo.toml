[package]
name = "titleshot-it"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sandbox integration tests for the titleshot contract (real wasm + outlayer/signer mocks). Independent of contract/src."

# Own workspace on purpose: the contract builds with Rust 1.86 (nearcore VM requirement) while
# near-workspaces needs a newer toolchain. Run with: cargo test (stable), after contract/build.sh and mocks/build.sh.
[workspace]

[dependencies]
near-workspaces = "~0.23"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
anyhow = "1"
sha2 = "0.10"
sha3 = "0.10"
bs58 = "0.5"
k256 = { version = "0.13", features = ["ecdsa"] }
bout-sim = { path = "../../crates/bout-sim" }
ed25519-dalek = "2"
